<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Washing Machine Diagnostic Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        #canvas-container {
            width: 70%;
            height: 100%;
            position: relative;
        }

        #ui-panel {
            width: 30%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #00ffff;
        }

        h1 {
            text-align: center;
            color: #00ffff;
            margin-bottom: 20px;
            font-size: 1.5em;
            text-shadow: 0 0 10px #00ffff;
        }

        h2 {
            color: #00ff88;
            margin: 15px 0 10px 0;
            font-size: 1.1em;
            border-bottom: 1px solid #00ff88;
            padding-bottom: 5px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .program-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .program-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .program-btn.active {
            background: linear-gradient(135deg, #00ffff 0%, #00ff88 100%);
            color: #000;
        }

        .variable-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .variable-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .variable-btn.active {
            background: linear-gradient(135deg, #00ffff 0%, #00ff88 100%);
            color: #000;
        }

        #start-stop-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            margin-top: 10px;
        }

        #start-stop-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.4);
        }

        #start-stop-btn.running {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .diagnostic-item {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .diagnostic-label {
            color: #00ffff;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .diagnostic-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #00ff88;
        }

        .status-active {
            color: #00ff88;
            text-shadow: 0 0 5px #00ff88;
        }

        .status-inactive {
            color: #ff4444;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #00ff88);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        #cycle-message {
            text-align: center;
            padding: 15px;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 1.1em;
            color: #00ff88;
            display: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .current-state {
            text-align: center;
            padding: 10px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .current-state-label {
            color: #aaa;
            font-size: 0.8em;
        }

        .current-state-value {
            color: #00ffff;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="canvas-container"></div>
        <div id="ui-panel">
            <h1>🔧 WashTech Pro X1</h1>
            
            <div class="control-group">
                <h2>Program Selection</h2>
                <div class="btn-grid">
                    <button class="program-btn active" data-program="cotton">Cotton</button>
                    <button class="program-btn" data-program="quick">Quick Wash</button>
                    <button class="program-btn" data-program="delicate">Delicate</button>
                    <button class="program-btn" data-program="spin">Single Spin</button>
                    <button class="program-btn" data-program="silk">Silk</button>
                    <button class="program-btn" data-program="down">Down</button>
                </div>
            </div>

            <div class="control-group">
                <h2>Washing Variables</h2>
                <div class="btn-grid">
                    <button class="variable-btn active" data-variable="temp-40">Temp: 40°C</button>
                    <button class="variable-btn" data-variable="temp-60">Temp: 60°C</button>
                    <button class="variable-btn active" data-variable="spin-800">Spin: 800</button>
                    <button class="variable-btn" data-variable="spin-1200">Spin: 1200</button>
                </div>
            </div>

            <div class="control-group">
                <h2>System Status</h2>
                <div class="current-state">
                    <div class="current-state-label">Current Phase</div>
                    <div class="current-state-value" id="phase-display">Ready</div>
                </div>

                <div class="diagnostic-item">
                    <div class="diagnostic-label">⚡ Motor</div>
                    <div class="diagnostic-value">
                        <span id="motor-status">Off</span> | 
                        <span id="motor-rpm">0</span> RPM
                    </div>
                </div>

                <div class="diagnostic-item">
                    <div class="diagnostic-label">💧 Water Inlet Valve</div>
                    <div class="diagnostic-value" id="water-valve">Closed</div>
                </div>

                <div class="diagnostic-item">
                    <div class="diagnostic-label">🌀 Drain Pump</div>
                    <div class="diagnostic-value" id="drain-pump">Idle</div>
                </div>

                <div class="diagnostic-item">
                    <div class="diagnostic-label">🔥 Heater</div>
                    <div class="diagnostic-value">
                        <span id="heater-status">Off</span> | 
                        <span id="heater-temp">20</span>°C
                    </div>
                </div>

                <div class="diagnostic-item">
                    <div class="diagnostic-label">🔒 Door Lock</div>
                    <div class="diagnostic-value" id="door-lock">Unlocked</div>
                </div>

                <div class="diagnostic-item">
                    <div class="diagnostic-label">📊 Cycle Progress</div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div style="text-align: right; margin-top: 5px; color: #00ffff;">
                        <span id="progress-percent">0</span>%
                    </div>
                </div>

                <button id="start-stop-btn">▶ START</button>
                <div id="cycle-message">✨ Cycle Complete! ✨</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== Three.js Setup ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setClearColor(0x1a1a2e, 1);
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0x00ffff, 0.5, 10);
        pointLight.position.set(-2, 2, 3);
        scene.add(pointLight);

        // Camera position
        camera.position.z = 5;
        camera.position.x = 0;
        camera.position.y = 1;

        // ==================== Washing Machine Components ====================
        
        // Main body (white box)
        const bodyGeometry = new THREE.BoxGeometry(3, 3.5, 2);
        const bodyMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xffffff,
            shininess: 100
        });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        scene.add(body);

        // Control panel strip (dark gray)
        const panelGeometry = new THREE.BoxGeometry(3, 0.5, 2.01);
        const panelMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x333333,
            shininess: 50
        });
        const controlPanel = new THREE.Mesh(panelGeometry, panelMaterial);
        controlPanel.position.y = 1.5;
        scene.add(controlPanel);

        // Drum opening (black circle)
        const drumOpeningGeometry = new THREE.CylinderGeometry(1.2, 1.2, 0.1, 32);
        const drumOpeningMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x111111,
            shininess: 100
        });
        const drumOpening = new THREE.Mesh(drumOpeningGeometry, drumOpeningMaterial);
        drumOpening.rotation.x = Math.PI / 2;
        drumOpening.position.z = 1.01;
        scene.add(drumOpening);

        // Drum (rotating cylinder)
        const drumGeometry = new THREE.CylinderGeometry(1, 1, 1.8, 32, 1, true);
        const drumMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xcccccc,
            shininess: 100,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.3
        });
        const drum = new THREE.Mesh(drumGeometry, drumMaterial);
        drum.rotation.x = Math.PI / 2;
        drum.position.z = 0.5;
        scene.add(drum);

        // Drum interior lines (for visual rotation effect)
        const drumLines = [];
        for (let i = 0; i < 8; i++) {
            const lineGeometry = new THREE.BoxGeometry(0.05, 0.8, 1.6);
            const lineMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
            const line = new THREE.Mesh(lineGeometry, lineMaterial);
            line.rotation.x = Math.PI / 2;
            line.rotation.z = (i * Math.PI) / 4;
            line.position.z = 0.5;
            drum.add(line);
            drumLines.push(line);
        }

        // Water sphere (inside drum)
        const waterGeometry = new THREE.SphereGeometry(0.8, 32, 32);
        const waterMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x0066ff,
            transparent: true,
            opacity: 0.6,
            shininess: 100
        });
        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.position.z = 0.5;
        water.scale.set(1, 1, 0.1);
        scene.add(water);

        // Door glass (transparent disk)
        const doorGeometry = new THREE.CylinderGeometry(1.15, 1.15, 0.05, 32);
        const doorMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x88ccff,
            transparent: true,
            opacity: 0.4,
            shininess: 100
        });
        const door = new THREE.Mesh(doorGeometry, doorMaterial);
        door.rotation.x = Math.PI / 2;
        door.position.z = 1.03;
        scene.add(door);

        // Door lock indicator (small LED)
        const lockGeometry = new THREE.SphereGeometry(0.08, 16, 16);
        const lockMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xff0000,
            emissive: 0xff0000,
            emissiveIntensity: 0.5
        });
        const doorLock = new THREE.Mesh(lockGeometry, lockMaterial);
        doorLock.position.set(1.3, 0.8, 1.02);
        scene.add(doorLock);

        // Feet
        const footGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.2, 16);
        const footMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
        
        const positions = [
            [-1.3, -1.85, 0.8],
            [1.3, -1.85, 0.8],
            [-1.3, -1.85, -0.8],
            [1.3, -1.85, -0.8]
        ];

        positions.forEach(pos => {
            const foot = new THREE.Mesh(footGeometry, footMaterial);
            foot.position.set(...pos);
            scene.add(foot);
        });

        // ==================== Application State ====================
        
        let isRunning = false;
        let currentPhase = 'Ready';
        let progress = 0;
        let motorRPM = 0;
        let waterLevel = 0;
        let currentTemp = 20;
        let targetTemp = 40;
        let selectedProgram = 'cotton';
        let selectedSpinSpeed = 800;

        const programs = {
            cotton: { duration: 120, phases: ['Fill', 'Heat', 'Wash', 'Drain', 'Rinse', 'Spin', 'Done'] },
            quick: { duration: 30, phases: ['Fill', 'Wash', 'Spin', 'Done'] },
            delicate: { duration: 60, phases: ['Fill', 'Wash', 'Rinse', 'Spin', 'Done'] },
            spin: { duration: 15, phases: ['Spin', 'Done'] },
            silk: { duration: 45, phases: ['Fill', 'Wash', 'Rinse', 'Spin', 'Done'] },
            down: { duration: 90, phases: ['Fill', 'Heat', 'Wash', 'Rinse', 'Spin', 'Done'] }
        };

        let phaseIndex = 0;
        let phaseStartTime = 0;
        let cycleDuration = 0;

        // ==================== UI Event Handlers ====================

        // Program buttons
        document.querySelectorAll('.program-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isRunning) return;
                document.querySelectorAll('.program-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedProgram = btn.dataset.program;
            });
        });

        // Variable buttons
        document.querySelectorAll('.variable-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isRunning) return;
                
                if (btn.dataset.variable.includes('temp')) {
                    document.querySelectorAll('.variable-btn[data-variable*="temp"]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    targetTemp = parseInt(btn.dataset.variable.split('-')[1]);
                } else if (btn.dataset.variable.includes('spin')) {
                    document.querySelectorAll('.variable-btn[data-variable*="spin"]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedSpinSpeed = parseInt(btn.dataset.variable.split('-')[1]);
                }
            });
        });

        // Start/Stop button
        const startStopBtn = document.getElementById('start-stop-btn');
        startStopBtn.addEventListener('click', () => {
            if (isRunning) {
                stopCycle();
            } else {
                startCycle();
            }
        });

        function startCycle() {
            isRunning = true;
            phaseIndex = 0;
            progress = 0;
            phaseStartTime = Date.now();
            cycleDuration = programs[selectedProgram].duration * 1000;
            
            startStopBtn.textContent = '⏹ STOP';
            startStopBtn.classList.add('running');
            document.getElementById('cycle-message').style.display = 'none';
            
            setPhase(programs[selectedProgram].phases[0]);
        }

        function stopCycle() {
            isRunning = false;
            motorRPM = 0;
            waterLevel = 0;
            
            startStopBtn.textContent = '▶ START';
            startStopBtn.classList.remove('running');
            
            setPhase('Stopped');
            updateDiagnostics();
        }

        function setPhase(phase) {
            currentPhase = phase;
            document.getElementById('phase-display').textContent = phase;
        }

        function completeCycle() {
            isRunning = false;
            motorRPM = 0;
            waterLevel = 0;
            
            startStopBtn.textContent = '▶ START';
            startStopBtn.classList.remove('running');
            
            setPhase('Done');
            document.getElementById('cycle-message').style.display = 'block';
            updateDiagnostics();
        }

        // ==================== Diagnostic Updates ====================

        function updateDiagnostics() {
            // Motor
            const motorStatusEl = document.getElementById('motor-status');
            const motorRpmEl = document.getElementById('motor-rpm');
            
            if (motorRPM > 0) {
                motorStatusEl.textContent = 'Running';
                motorStatusEl.className = 'status-active';
            } else {
                motorStatusEl.textContent = 'Off';
                motorStatusEl.className = 'status-inactive';
            }
            
            // Add some randomness to RPM display
            const displayedRPM = motorRPM > 0 ? motorRPM + Math.floor(Math.random() * 50 - 25) : 0;
            motorRpmEl.textContent = Math.abs(displayedRPM);

            // Water valve
            const waterValveEl = document.getElementById('water-valve');
            if (['Fill', 'Rinse'].includes(currentPhase)) {
                waterValveEl.textContent = 'Open';
                waterValveEl.className = 'diagnostic-value status-active';
            } else {
                waterValveEl.textContent = 'Closed';
                waterValveEl.className = 'diagnostic-value status-inactive';
            }

            // Drain pump
            const drainPumpEl = document.getElementById('drain-pump');
            if (['Drain', 'Spin'].includes(currentPhase)) {
                drainPumpEl.textContent = 'Active';
                drainPumpEl.className = 'diagnostic-value status-active';
            } else {
                drainPumpEl.textContent = 'Idle';
                drainPumpEl.className = 'diagnostic-value status-inactive';
            }

            // Heater
            const heaterStatusEl = document.getElementById('heater-status');
            const heaterTempEl = document.getElementById('heater-temp');
            
            if (currentPhase === 'Heat' || (currentPhase === 'Wash' && currentTemp < targetTemp)) {
                heaterStatusEl.textContent = 'On';
                heaterStatusEl.className = 'status-active';
                currentTemp = Math.min(currentTemp + 0.5, targetTemp);
            } else {
                heaterStatusEl.textContent = 'Off';
                heaterStatusEl.className = 'status-inactive';
            }
            heaterTempEl.textContent = Math.round(currentTemp);

            // Door lock
            const doorLockEl = document.getElementById('door-lock');
            if (isRunning) {
                doorLockEl.textContent = 'Locked';
                doorLockEl.className = 'diagnostic-value status-active';
                doorLock.material.color.setHex(0x00ff00);
                doorLock.material.emissive.setHex(0x00ff00);
            } else {
                doorLockEl.textContent = 'Unlocked';
                doorLockEl.className = 'diagnostic-value status-inactive';
                doorLock.material.color.setHex(0xff0000);
                doorLock.material.emissive.setHex(0xff0000);
            }

            // Progress
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-percent').textContent = Math.round(progress);
        }

        // ==================== Phase Logic ====================

        function updatePhaseLogic() {
            if (!isRunning) return;

            const elapsed = Date.now() - phaseStartTime;
            const totalProgress = (elapsed / cycleDuration) * 100;
            progress = Math.min(totalProgress, 100);

            const phases = programs[selectedProgram].phases;
            const phaseDuration = cycleDuration / phases.length;
            const currentPhaseIndex = Math.floor(elapsed / phaseDuration);

            if (currentPhaseIndex >= phases.length) {
                completeCycle();
                return;
            }

            if (currentPhaseIndex !== phaseIndex) {
                phaseIndex = currentPhaseIndex;
                setPhase(phases[phaseIndex]);
            }

            // Set motor RPM and water level based on phase
            switch (currentPhase) {
                case 'Fill':
                    motorRPM = 0;
                    waterLevel = Math.min(waterLevel + 0.02, 1);
                    break;
                case 'Heat':
                    motorRPM = 50;
                    waterLevel = 0.8;
                    break;
                case 'Wash':
                    motorRPM = 200 + Math.sin(Date.now() / 500) * 100;
                    waterLevel = 0.7;
                    break;
                case 'Drain':
                    motorRPM = 0;
                    waterLevel = Math.max(waterLevel - 0.03, 0);
                    break;
                case 'Rinse':
                    motorRPM = 100;
                    waterLevel = Math.min(waterLevel + 0.02, 0.6);
                    break;
                case 'Spin':
                    motorRPM = selectedSpinSpeed * (0.8 + Math.random() * 0.4);
                    waterLevel = Math.max(waterLevel - 0.05, 0);
                    break;
                default:
                    motorRPM = 0;
                    waterLevel = 0;
            }
        }

        // ==================== Animation Loop ====================

        let drumRotation = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Update phase logic
            updatePhaseLogic();

            // Rotate drum based on motor RPM
            if (motorRPM > 0) {
                drumRotation += (motorRPM / 60) * 0.01;
                drum.rotation.z = drumRotation;
            }

            // Update water level visualization
            water.scale.y = 0.1 + (waterLevel * 1.5);
            water.scale.x = 0.5 + (waterLevel * 0.5);
            water.material.opacity = 0.3 + (waterLevel * 0.4);

            // Subtle floating animation for the machine
            body.position.y = Math.sin(Date.now() / 1000) * 0.02;
            controlPanel.position.y = 1.5 + Math.sin(Date.now() / 1000) * 0.02;

            // Update diagnostics every 500ms
            if (Date.now() % 500 < 20) {
                updateDiagnostics();
            }

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
